[package]
name = "protide"
description = "Free and open-source API testing tool"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "protide"
path = "src/main.rs"

[dependencies]
protide-core = { workspace = true, features = ["full-sync"] }
protide-ui = { workspace = true }
env_logger = "0.11"

gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
gpui-component-assets = { workspace = true }

anyhow = { workspace = true }
image = { workspace = true }
dirs = { workspace = true }

# Setting the Dock icon on unbundled macOS runs (see set_dock_icon in main.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
