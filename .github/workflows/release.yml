name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # Gate: no artifact is built or published unless the full local gate passes on
  # both platforms first. `make verify` is the same command developers run, so
  # there is one definition of "verified" rather than a CI-only variant.
  test:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # fmt-check -> clippy (-D warnings) -> tests -> audit. cargo-audit is not
      # installed on the runner, so that final step reports a skip rather than
      # failing; advisories are tracked locally against .cargo/audit.toml.
      - name: make verify
        run: make verify

  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/linux-deps

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-dev rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install fpm
        run: sudo gem install fpm --no-document

      - name: Package
        run: |
          VERSION="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}"
          PKG_VER="${VERSION#v}"

          # .tar.gz
          ARCHIVE="protide-${VERSION}-x86_64-linux"
          mkdir -p "$ARCHIVE"
          cp target/release/protide "$ARCHIVE/"
          cp -r crates/protide/assets "$ARCHIVE/"
          cp packaging/protide.desktop "$ARCHIVE/"
          cp packaging/install-desktop.sh "$ARCHIVE/"
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"

          # .deb
          fpm -s dir -t deb \
            --name protide \
            --version "$PKG_VER" \
            --architecture amd64 \
            --description "Native API testing tool — HTTP, GraphQL, WebSocket, gRPC and more" \
            --url "https://github.com/dreygur/protide" \
            --maintainer "dreygur" \
            --package "protide-${VERSION}-amd64.deb" \
            target/release/protide=/usr/bin/protide \
            crates/protide/assets/=/usr/share/protide/assets/ \
            packaging/protide.desktop=/usr/share/applications/protide.desktop \
            crates/protide/assets/protide-logo.png=/usr/share/icons/hicolor/256x256/apps/protide.png

          # .rpm
          fpm -s dir -t rpm \
            --name protide \
            --version "$PKG_VER" \
            --architecture x86_64 \
            --description "Native API testing tool — HTTP, GraphQL, WebSocket, gRPC and more" \
            --url "https://github.com/dreygur/protide" \
            --package "protide-${VERSION}-x86_64.rpm" \
            target/release/protide=/usr/bin/protide \
            crates/protide/assets/=/usr/share/protide/assets/ \
            packaging/protide.desktop=/usr/share/applications/protide.desktop \
            crates/protide/assets/protide-logo.png=/usr/share/icons/hicolor/256x256/apps/protide.png

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            protide-*.tar.gz
            protide-*.deb
            protide-*.rpm
          generate_release_notes: true

  build-macos:
    name: Build macOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package .dmg
        run: |
          VERSION="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}"

          # Same bundler as `make bundle-mac`, so the released .app matches a local
          # one (icns sizes, bundle id, ad-hoc signature - arm64 won't launch unsigned)
          PROTIDE_VERSION="${VERSION#v}" packaging/macos/bundle.sh "$PWD/Protide.app"

          # Staging folder with symlink to /Applications for drag-install UX.
          # ditto, not cp: it preserves the code signature.
          DMG_STAGE="dmg-stage"
          mkdir -p "$DMG_STAGE"
          ditto Protide.app "$DMG_STAGE/Protide.app"
          ln -s /Applications "$DMG_STAGE/Applications"

          # macos-latest runners are Apple Silicon, so this is an arm64-only build
          hdiutil create \
            -volname "Protide ${VERSION}" \
            -srcfolder "$DMG_STAGE" \
            -ov -format UDZO \
            "protide-${VERSION}-macos-arm64.dmg"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: protide-*.dmg
          generate_release_notes: false
