[workspace]
resolver = "2"
members = [
    "crates/http-parser",
    "crates/protide-core",
    "crates/protide-ui",
    "crates/protide",
    "crates/protide-mcp",
    "crates/protide-lsp",
]

[workspace.package]
version = "0.1.0-alpha.5"
edition = "2024"
# Floor implied by edition 2024. The toolchain actually used is pinned in
# rust-toolchain.toml; this only documents the oldest compiler we claim to support.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/dreygur/protide"
authors = ["Protide Contributors"]

# Mirrors Zed's release profile - Protide is built on GPUI and Zed is the
# authoritative reference for how to ship it (see CLAUDE.md "GPUI Reference").
# `debug = "limited"` keeps line tables so user crash reports stay readable.
[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

# Inherited by every member via `[lints] workspace = true`.
# `make clippy` / `make verify` run with `-D warnings`, so anything left at
# "warn" here is a hard failure before push.
[workspace.lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_extern_crates = "warn"
macro_use_extern_crate = "warn"
# `unsafe_code` is deliberately absent: crates/protide/src/main.rs has one
# legitimate objc2 call for the macOS Dock icon, and any level above "allow"
# would fail the `-D warnings` gate.

[workspace.lints.clippy]
# Scaffolding that must never reach a commit.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Accepted by design. Every other clippy allow has been paid off by fixing the
# call sites; only add to this list with a justification in the same style.
#
# 14 of the 17 sites are GPUI render/spawn helpers (8-11 args) that thread
# `window`/`cx`/theme colours alongside two or three real parameters. Bundling
# those into param structs buys nothing at the call site and hides which values
# a helper actually reads.
too_many_arguments = "allow"
# The three offenders are short-lived channel messages (`RunProgress`,
# `DataDrivenProgress`) and libp2p's `ProtideBehaviourEvent`. Boxing the large
# variant trades a stack-size win the enums never pay - they are moved straight
# into an mpsc send, which heap-allocates anyway - for an extra allocation per
# event plus a deref at every consumer; `ProtideBehaviourEvent`'s shape is
# additionally fixed by libp2p's `NetworkBehaviour` derive.
large_enum_variant = "allow"

[workspace.dependencies]
# Internal crates
http-parser = { path = "crates/http-parser" }
protide-core = { path = "crates/protide-core" }
protide-ui = { path = "crates/protide-ui" }

# UI Framework - same git spec as gpui-component so Cargo unifies to one commit
gpui = { git = "https://github.com/zed-industries/zed", features = ["wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["wayland", "x11", "font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = ["tree-sitter-javascript", "tree-sitter-graphql"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", package = "gpui-component-assets" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }

# URL/encoding
url = "2"
urlencoding = "2"
base64 = "0.22"

# JSONPath for request chaining
jsonpath-rust = "0.7"

# Error handling
anyhow = "1"
thiserror = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "multipart", "http2", "stream"] }

# Image loading (for app icon)
image = { version = "0.25", default-features = false, features = ["png"] }

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

# Grapheme segmentation (word selection must not split a grapheme cluster)
unicode-segmentation = "1"

# File watching
notify = "7"

# P2P networking
libp2p = { version = "0.56", features = ["tokio", "tcp", "quic", "noise", "yamux", "kad", "mdns", "gossipsub", "identify", "macros"] }

# PAKE cryptography
spake2 = "0.4"
chacha20poly1305 = "0.10"
blake3 = "1"
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }



# Paths
dirs = "6"

# JavaScript engine
rquickjs = { version = "0.6", features = ["classes", "properties"] }

# HTTP server for mock server
axum = "0.8"
hyper = { version = "1", features = ["full"] }
tower = "0.5"

# Async channels (executor-agnostic, used by GPUI/smol)
async-channel = "2"

# WebSocket client
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# Language server
tower-lsp = "0.20"

# gRPC client
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
protox = "0.7"

# CSV parsing for data-driven testing
csv = "1.3"

# gzip (de)compression for gRPC message-level compression
flate2 = "1"
