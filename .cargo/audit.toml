[advisories]
ignore = [
    # hickory-proto 0.25.x via libp2p-mdns 0.48 / libp2p 0.56 (latest).
    # No fix available: waiting on libp2p >=0.57 to bump hickory-proto to 0.26.1.
    "RUSTSEC-2026-0118",  # NSEC3 unbounded loop - no fixed version exists yet
    "RUSTSEC-2026-0119",  # O(n²) name compression - fixed in hickory-proto 0.26.1

    # Unmaintained transitive deps pulled in by gpui/zed git dependencies.
    # Cannot be upgraded without upstream gpui changes.
    "RUSTSEC-2025-0052",  # async-std (via gpui http_client)
    "RUSTSEC-2024-0384",  # instant (via gpui / notify)
    "RUSTSEC-2024-0436",  # paste (via gpui / rav1e)
    "RUSTSEC-2025-0134",  # rustls-pemfile (via gpui zed-reqwest)

    # quick-xml 0.30.0 (via xcb) and 0.39.4 (via wayland-scanner), both Linux-only
    # and both *build-time proc-macros* that parse the X11/Wayland protocol
    # definitions shipped with the build. These advisories are denial-of-service
    # on untrusted XML; the input here is trusted local data and never reaches
    # the runtime, so neither is exploitable. Fixing needs quick-xml >=0.41,
    # a major bump neither upstream has taken.
    "RUSTSEC-2026-0194",  # quadratic run time on duplicate attribute names
    "RUSTSEC-2026-0195",  # unbounded namespace-declaration allocation
]
